apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginxx
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
  - repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: '4.11.1'
    
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-addons
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 2
      backoff:
        duration: 2s 
        factor: 2 
        maxDuration: 2m 