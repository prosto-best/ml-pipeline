{{- if .Values.monitoring.pushgateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cnyrub-predictor.fullname" . }}-pushgateway
  labels:
    {{- include "cnyrub-predictor.labels" . | nindent 4 }}
    app.kubernetes.io/component: pushgateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "cnyrub-predictor.name" . }}-pushgateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "cnyrub-predictor.name" . }}-pushgateway
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: pushgateway
          image: "{{ .Values.monitoring.pushgateway.image }}"
          ports:
            - name: http
              containerPort: 9091
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cnyrub-predictor.fullname" . }}-pushgateway
  labels:
    {{- include "cnyrub-predictor.labels" . | nindent 4 }}
    app.kubernetes.io/component: pushgateway
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.monitoring.pushgateway.port }}
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: {{ include "cnyrub-predictor.name" . }}-pushgateway
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
